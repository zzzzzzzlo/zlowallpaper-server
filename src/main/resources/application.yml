spring:
  application:
    name: zlowallpaper-server
  profiles:
    default: local
  jackson:
    time-zone: UTC
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 10GB
      max-request-size: 11GB

server:
  port: ${SERVER_PORT:8080}
  address: 127.0.0.1
  servlet:
    context-path: /api/v1
  error:
    include-message: never
    include-stacktrace: never

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
  global-config:
    banner: false
    db-config:
      id-type: auto

wallpaper:
  auth:
    jwt-secret: "${AUTH_JWT_SECRET:}"
    access-token-seconds: 691200 # 8天
    session-days: 30
    retention-days: 7
  public-base-url: "${WALLPAPER_PUBLIC_BASE_URL:http://127.0.0.1:${server.port}/api/v1}"
  storage:
    provider: "${STORAGE_PROVIDER:OSS}"
    root: "${WALLPAPER_STORAGE_ROOT:D:/Codex/software/zlowallpaper-storage}"
  cover-cache:
    enabled: "${COVER_CACHE_ENABLED:true}"
    ttl-seconds: "${COVER_CACHE_TTL_SECONDS:21600}" # 写入起6小时过期，不因访问续期
    wait-seconds: 10 # 同一封面已有回源任务时，其他请求最多等待10秒，不取消加载者
  cos:
    region: "${COS_REGION:}"
    bucket: "${COS_BUCKET:}"
    secret-id: "${COS_SECRET_ID:}"
    secret-key: "${COS_SECRET_KEY:}"
  oss:
    endpoint: "${OSS_ENDPOINT:}"
    region: "${OSS_REGION:}"
    bucket: "${OSS_BUCKET:}"
    access-key-id: "${OSS_ACCESS_KEY_ID:}"
    access-key-secret: "${OSS_ACCESS_KEY_SECRET:}"
  upload:
    ffprobe: "${FFPROBE_PATH:ffprobe}"
    ffmpeg: "${FFMPEG_PATH:ffmpeg}"
    media-timeout-seconds: 20
    cover-max-edge: 1920 # 仅处理封面，保持比例、不放大小图
    cover-jpeg-quality: 2 # FFmpeg q:v，2–31，越小越清晰
  cors:
    allowed-origins: "${WALLPAPER_CORS_ALLOWED_ORIGINS:http://127.0.0.1:4173,http://localhost:4173}"
