openapi: 3.0.3
info:
  title: ZloWallpaper API
  version: 1.0.0
  description: |
    前后端契约基线；auth、catalog查询与管理、订单创建/查询、壁纸币付款、已购列表及OSS下载授权已实现。所有成功响应 code=OK，错误保留实际 HTTP 状态。
    ID是字符串；不维护商品资源历史版本，价格和余额均为壁纸币最小整数单位（100单位=1币），sizeBytes 为十进制字符串，时间为 UTC ISO-8601。
    禁止重定向；下载票据 URL 返回文件而非 JSON。真实支付不在 v1 范围。
servers:
  - url: http://127.0.0.1:8080/api/v1
    description: 本机开发
tags:
  - name: Auth
  - name: Catalog
  - name: Orders
  - name: Downloads
  - name: Admin
paths:
  /auth/register:
    post:
      operationId: register
      tags: [Auth]
      summary: 注册；成功后需登录
      requestBody: { $ref: '#/components/requestBodies/Credentials' }
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [username]
                        properties:
                          username: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: 登录；密码错误返回 401 INVALID_CREDENTIALS
      requestBody: { $ref: '#/components/requestBodies/Credentials' }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        default: { $ref: '#/components/responses/Error' }
  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [Auth]
      summary: 刷新并轮换 refreshToken；过期/撤销返回 401
      requestBody: { $ref: '#/components/requestBodies/RefreshToken' }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        default: { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: 撤销当前会话；不要求有效 accessToken
      requestBody: { $ref: '#/components/requestBodies/RefreshToken' }
      responses:
        '200': { $ref: '#/components/responses/Empty' }
        default: { $ref: '#/components/responses/Error' }
  /me:
    get:
      operationId: currentUser
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        default: { $ref: '#/components/responses/Error' }
  /categories:
    get:
      operationId: categories
      tags: [Catalog]
      responses:
        '200':
          description: 全部启用分类
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Category' }
        default: { $ref: '#/components/responses/Error' }
  /wallpapers:
    get:
      operationId: wallpapers
      tags: [Catalog]
      summary: 已上架商品；标题搜索；稳定排序
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - name: keyword
          in: query
          schema: { type: string, maxLength: 100, default: '' }
        - name: categoryId
          in: query
          schema: { type: string, default: '' }
      responses:
        '200':
          description: 商品分页
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ProductPage' }
        default: { $ref: '#/components/responses/Error' }
  /wallpapers/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: wallpaperDetail
      tags: [Catalog]
      summary: 商品详情；不含原文件 URL
      responses:
        '200': { $ref: '#/components/responses/Product' }
        default: { $ref: '#/components/responses/Error' }
  /orders:
    post:
      operationId: createOrder
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      summary: 创建订单；免费直接 PAID 并授权；返回已有有效订单避免重复购买
      description: |
        已实现，无需请求键。已有权益时返回来源PAID订单；否则复用同账号同商品的PENDING订单，返回200。
        确需新订单时检查商品已上架，并取服务端价格、标题和币种快照，返回201。
        免费订单和权益在同一事务提交；收费订单先PENDING。行锁和唯一约束防止并发重复购买。
        取消/退款后没有有效权益与待付款订单时可以新购买；不提供旧请求键的历史结果重放。
        正常付款使用POST /orders/{id}/pay，实际扣减站内壁纸币；不再返回testPaymentEnabled。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [wallpaperId]
              properties:
                wallpaperId: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._-]+$' }
      responses:
        '200': { $ref: '#/components/responses/Order' }
        '201': { $ref: '#/components/responses/Order' }
        default: { $ref: '#/components/responses/Error' }
  /me/orders:
    get:
      operationId: myOrders
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      summary: 本账号全部订单；v1 不分页，超出业务上限明确报错而非截断
      description: |
        已实现。无需请求体或查询参数，身份来自Bearer，不接受前端指定用户ID。
        返回本账号PENDING、PAID、CANCELED、REFUNDED全部状态订单；按createdAt倒序、相同时间按id倒序。
        title、amountCents、currency使用下单快照，不受商品改名、调价、下架影响；历史CNY订单保持原币种。
        没有订单时data为空数组。最多1000条；超过返回409 ORDER_LIST_LIMIT_EXCEEDED，data为null，不静默截断。
      responses:
        '200':
          description: 订单数组
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Order' }
        default: { $ref: '#/components/responses/Error' }
  /orders/{id}/pay:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: payOrder
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      summary: 站内壁纸币付款；余额、订单和权益同事务提交
      description: |
        已实现。无业务请求体，无需请求键；身份来自Bearer，不使用测试支付开关。
        先锁用户再锁本用户订单。PENDING且无权益时按订单amountCents扣余额，更新PAID/COIN并新增权益。
        余额不足返回409 INSUFFICIENT_BALANCE，余额、订单及权益均不改变；任何写入异常一并回滚。
        PAID且有该订单授予的权益时返回原订单，不再次扣币，不改付款时间和方式。
        取消/退款返回409 ORDER_NOT_PAYABLE；订单与权益不一致返回409 PURCHASE_STATE_CONFLICT。
        他人或不存在订单返回404 ORDER_NOT_FOUND。按下单快照成交，后续调价/下架不影响已有待付款订单。
        余额通过GET /me的balanceCents读取，100最小整数单位=1壁纸币，当前商品币种ZLC。
      responses:
        '200': { $ref: '#/components/responses/Order' }
        default: { $ref: '#/components/responses/Error' }
  /me/wallpapers:
    get:
      operationId: ownedWallpapers
      tags: [Catalog]
      security: [{ bearerAuth: [] }]
      summary: 当前账号有效购买权益对应商品，包括已购且允许下载的停售商品
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - name: keyword
          in: query
          schema: { type: string, maxLength: 100, default: '' }
        - name: categoryId
          in: query
          schema: { type: string, default: '' }
        - name: wallpaperId
          in: query
          description: 可选商品精确筛选，用于客户端确认指定商品的购买权益；身份仍来自Bearer
          schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._-]+$' }
      description: |
        已实现，归属catalog，复用WallpaperMapper和WallpaperVO。身份来自Bearer，不接收用户ID。
        只返回本账号当前权益关联的商品；不限制必须上架，分类停用不隐藏已购商品。
        返回当前商品和当前文件资料，不返回原文件地址；按权益grantedAt及权益id倒序。
        data为ProductPage，默认page=1、pageSize=12，pageSize最大50；无权益或越界items=[]，保留筛选总数。
        不再限制完整已购数量为200。标题关键词、分类和商品筛选在数据库分页前执行。
        coverUrl为/me/wallpapers/{id}/cover，读取图片时须携带本账号Bearer，不能按匿名公开图片加载。
      responses:
        '200':
          description: ProductPage分页，无本地绝对路径或原文件 URL
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ProductPage' }
        default: { $ref: '#/components/responses/Error' }
  /me/wallpapers/{id}/cover:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: ownedWallpaperCover
      tags: [Catalog]
      security: [{ bearerAuth: [] }]
      summary: 当前账号已购商品封面；包含停售商品，未购404
      description: |
        已实现，返回原始封面字节，非JSON。无登录401；没有本账号权益或封面不可用404。
        Cache-Control为no-store。公开/catalog/covers/{id}继续只允许已上架商品。
      responses:
        '200':
          description: 封面图片，最大4MiB
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/bmp: { schema: { type: string, format: binary } }
        default: { $ref: '#/components/responses/Error' }
  /wallpapers/{id}/download-grants:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: downloadGrant
      tags: [Downloads]
      security: [{ bearerAuth: [] }]
      summary: 校验权益后签发短时票据；无权益返回 403 NOT_OWNED
      description: |
        已实现。无业务请求体，身份来自Bearer；一次联合查询确认本账号权益与当前原文件。
        已购停售商品仍可下载，未购或不存在商品返回403 NOT_OWNED；文件未就绪409 FILE_NOT_READY。
        支持COS和OSS原文件；遗留LOCAL返回503 STORAGE_NOT_SUPPORTED。配置问题返回503 COS_CONFIGURATION_ERROR或OSS_CONFIGURATION_ERROR。
        返回5分钟有效的HTTPS云存储GET签名URL，固定当前对象（有存储versionId时一并签名），不代理文件传输。
        下载时不向云存储发送账号Authorization。签名URL过期后重新申请；权益删除不会提前撤销已签发的短时URL。
        商品更换文件并清理旧对象后旧URL可能失效，重新申请取得当前文件资料；不保存商品历史版本。
        响应Cache-Control为no-store，不记录完整签名URL。云端CAM/RAM权限在实际GET时由COS/OSS校验。
      responses:
        '200':
          description: 下载授权；URL 必须直接 GET 返回 HTTP 200 文件字节
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DownloadGrant' }
        default: { $ref: '#/components/responses/Error' }
  /admin/categories:
    get:
      operationId: adminCategories
      tags: [Admin]
      summary: 管理分类完整列表（包含停用分类）
      description: |
        已实现。无业务查询参数，不分页。
        按 sortOrder 升序、同值按 id 升序；wallpaperCount 计算所有商品状态的引用数。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 管理分类列表
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AdminCategory' }
        default: { $ref: '#/components/responses/CategoryError' }
    post:
      operationId: createAdminCategory
      tags: [Admin]
      summary: 新增分类
      description: 已实现；名称 trim 后不可空且大小写不敏感地唯一（包括停用分类）。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryCreate' }
      responses:
        '201': { $ref: '#/components/responses/AdminCategory' }
        default: { $ref: '#/components/responses/CategoryError' }
  /admin/categories/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      operationId: updateAdminCategory
      tags: [Admin]
      summary: 分类改名、排序、启用或停用
      description: |
        已实现；只发送实际变化项，省略字段保留原值。
        停用不下架或删除商品；新建商品或更换分类只允许启用分类，原商品可保留停用分类。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryUpdate' }
      responses:
        '200': { $ref: '#/components/responses/AdminCategory' }
        default: { $ref: '#/components/responses/CategoryError' }
    delete:
      operationId: deleteAdminCategory
      tags: [Admin]
      summary: 仅删除无任何商品引用的分类
      description: |
        已实现。无请求体；任何状态商品引用时返回 409 CATEGORY_IN_USE。
        保留数据库 ON DELETE RESTRICT，不连带删除商品、文件、订单或购买权益，不将失败转换成停用。
        列表计数只是快照，不是删除授权；再次删除不存在分类返回 404 CATEGORY_NOT_FOUND。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 仅分类已删除，data 必须是空对象；不是 HTTP 204
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data: { type: object, additionalProperties: false, maxProperties: 0 }
        default: { $ref: '#/components/responses/CategoryError' }
  /admin/wallpapers:
    get:
      operationId: adminWallpapers
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: 含 DRAFT/PUBLISHED/WITHDRAWN 的分页
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, page, pageSize, total]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/AdminProduct' }
                          page: { type: integer, minimum: 1 }
                          pageSize: { type: integer, minimum: 1, maximum: 50 }
                          total: { type: integer, minimum: 0 }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: adminCreateWallpaper
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: 一次提交资料与两份文件，创建DRAFT商品
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - { $ref: '#/components/schemas/ProductMutation' }
                - required: [title, categoryId, priceCents, originalFile, coverFile]
      responses:
        '201': { $ref: '#/components/responses/AdminProduct' }
        default: { $ref: '#/components/responses/Error' }
  /admin/wallpapers/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      operationId: adminUpdateWallpaper
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: 修改资料及可选替换文件，不维护历史版本
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ProductMutation' }
      responses:
        '200': { $ref: '#/components/responses/AdminProduct' }
        default: { $ref: '#/components/responses/Error' }
  /admin/wallpapers/{id}/cover:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: adminWallpaperCover
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: 管理员预览商品当前封面，包括草稿和下架商品
      description: 带Bearer读取图片；响应no-store，不允许客户端指定存储位置。
      responses:
        '200':
          description: 最大4MiB的图片字节，不包装JSON
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/bmp: { schema: { type: string, format: binary } }
        default: { $ref: '#/components/responses/Error' }
  /admin/wallpapers/{id}/publication:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      operationId: adminPublishWallpaper
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: 上下架；验证商品两份文件完整才允许 PUBLISHED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              additionalProperties: false
              properties:
                status: { type: string, enum: [PUBLISHED, WITHDRAWN] }
      responses:
        '200': { $ref: '#/components/responses/AdminProduct' }
        default: { $ref: '#/components/responses/Error' }
  /health:
    get:
      operationId: health
      summary: 服务就绪检查；不可泄漏内部连接串；桌面不消费
      responses:
        '200': { $ref: '#/components/responses/Empty' }
        default: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._-]+$' }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 12 }
  requestBodies:
    Credentials:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [username, password]
            properties:
              username: { type: string, minLength: 3, maxLength: 32 }
              password: { type: string, format: password, minLength: 8, maxLength: 128 }
    RefreshToken:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [refreshToken]
            properties:
              refreshToken: { type: string, minLength: 1 }
  responses:
    Error:
      description: |
        400/422 VALIDATION_ERROR；401 INVALID_CREDENTIALS/SESSION_EXPIRED；403 NOT_OWNED/FORBIDDEN；
        404 PRODUCT_NOT_FOUND/ORDER_NOT_FOUND；409 USERNAME_EXISTS/IDEMPOTENCY_CONFLICT/ORDER_NOT_PAYABLE/PURCHASE_STATE_CONFLICT/INSUFFICIENT_BALANCE；429 RATE_LIMITED；500/503 服务故障。
      content:
        application/json:
          schema:
            type: object
            required: [code, message, data, requestId]
            properties:
              code: { type: string, example: NOT_OWNED }
              message: { type: string, example: 尚未拥有该壁纸 }
              data: { nullable: true, example: null }
              requestId: { type: string }
    Empty:
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/Envelope' }
              - type: object
                properties:
                  data: { type: object }
    Session:
      description: 登录会话
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/Envelope' }
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/Session' }
    Product:
      description: 商品详情
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/Envelope' }
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/Product' }
    Order:
      description: 服务端订单，不代表 PENDING 已购买成功
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/Envelope' }
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/Order' }
    AdminProduct:
      description: 管理员商品详情
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/Envelope' }
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/AdminProduct' }
    CategoryError:
      description: |
        实际 HTTP 状态：400 VALIDATION_ERROR；401 SESSION_EXPIRED；403 FORBIDDEN；
        404 CATEGORY_NOT_FOUND；409 CATEGORY_NAME_EXISTS/CATEGORY_IN_USE；500/503 服务故障。
        data 为 null，不使用 HTTP 200 表示错误，不自动重放写请求。
      content:
        application/json:
          schema:
            type: object
            required: [code, message, data, requestId]
            properties:
              code: { type: string }
              message: { type: string }
              data: { nullable: true, example: null }
              requestId: { type: string }
    AdminCategory:
      description: 服务端生成的管理分类及动态商品引用数
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/Envelope' }
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/AdminCategory' }
  schemas:
    Envelope:
      type: object
      required: [code, message, data, requestId]
      properties:
        code: { type: string, enum: [OK] }
        message: { type: string }
        requestId: { type: string }
    User:
      type: object
      required: [id, username, balanceCents]
      properties:
        id: { type: string, minLength: 1 }
        username: { type: string }
        balanceCents: { type: string, pattern: '^[0-9]+$', example: '10000', description: 壁纸币余额最小单位的十进制字符串，100单位=1币；新用户为0 }
    Session:
      type: object
      required: [accessToken, refreshToken, expiresIn, user]
      properties:
        accessToken: { type: string, minLength: 1 }
        refreshToken: { type: string, minLength: 1 }
        expiresIn: { type: integer, minimum: 60, maximum: 691200, example: 691200, description: 默认8天；不超过整组会话剩余期限 }
        user: { $ref: '#/components/schemas/User' }
    Category:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    AdminCategory:
      type: object
      required: [id, name, sortOrder, enabled, wallpaperCount]
      properties:
        id: { type: string, minLength: 1, example: '1', readOnly: true }
        name: { type: string, minLength: 1, maxLength: 64, description: trim 后 1–64 个 Unicode 字符 }
        sortOrder: { type: integer, format: int32, minimum: -2147483648, maximum: 2147483647 }
        enabled: { type: boolean }
        wallpaperCount: { type: integer, minimum: 0, readOnly: true, description: 所有商品状态引用总数，实时计算，不存进分类表 }
    CategoryCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 64, description: trim 后非空；包括停用分类的名称也不得重复 }
        sortOrder: { type: integer, format: int32, minimum: -2147483648, maximum: 2147483647, default: 0 }
        enabled: { type: boolean, default: true }
    CategoryUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 64, description: trim 后非空；包括停用分类的名称也不得重复 }
        sortOrder: { type: integer, format: int32, minimum: -2147483648, maximum: 2147483647 }
        enabled: { type: boolean }
    Product:
      type: object
      required: [id, title, description, categoryId, categoryName, type, priceCents, currency, coverUrl, width, height, fps, sha256, sizeBytes, creator]
      properties:
        id: { type: string, pattern: '^[A-Za-z0-9._-]+$', example: wp-1001 }
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 4000 }
        categoryId: { type: string }
        categoryName: { type: string }
        type: { type: string, enum: [IMAGE, GIF, VIDEO] }
        priceCents: { type: integer, minimum: 0, maximum: 100000000, description: 壁纸币价格最小单位，100单位=1币 }
        currency: { type: string, enum: [ZLC] }
        coverUrl: { type: string, format: uri, description: '最终HTTPS或本机HTTP，响应不超过4MiB；公开商品匿名可读，已购列表的/me/wallpapers/{id}/cover须携带账号Bearer' }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        fps: { type: number, minimum: 0 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$', description: 当前原文件校验值，用于下载校验及本地文件识别 }
        sizeBytes: { type: string, pattern: '^[1-9][0-9]*$', example: '18422301' }
        creator: { type: string }
    ProductPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Product' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 50 }
        total: { type: integer, minimum: 0 }
    Order:
      type: object
      required: [id, userId, balanceCents, wallpaperId, title, amountCents, currency, status, createdAt]
      properties:
        id: { type: string, pattern: '^[A-Za-z0-9._-]+$' }
        userId: { type: string, description: 当前登录用户ID，不接受前端指定归属 }
        balanceCents: { type: string, pattern: '^[0-9]+$', description: 本次响应时的当前余额，付款成功响应为扣款后余额；不是历史余额快照 }
        wallpaperId: { type: string }
        title: { type: string }
        amountCents: { type: integer, minimum: 0, description: 下单金额快照，ZLC订单按相同整数值扣余额 }
        currency: { type: string, enum: [ZLC, CNY], description: 新订单ZLC；迁移前历史已付款等订单可能保留CNY }
        status: { type: string, enum: [PENDING, PAID, CANCELED, REFUNDED] }
        createdAt: { type: string, format: date-time }
    DownloadGrant:
      type: object
      required: [wallpaperId, url, expiresAt, fileExtension, sizeBytes, sha256]
      properties:
        wallpaperId: { type: string }
        url: { type: string, format: uri, description: HTTPS/本机 HTTP 最终文件 URL；不需要账号 Authorization }
        expiresAt: { type: string, format: date-time }
        fileExtension: { type: string, enum: [jpg, jpeg, png, bmp, webp, gif, mp4, webm, mov, avi] }
        sizeBytes: { type: string, pattern: '^[1-9][0-9]*$', description: 实际文件字节数，最大 10737418240 }
        sha256: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
    ProductMutation:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 4000 }
        categoryId: { type: string }
        priceCents: { type: integer, minimum: 0, maximum: 100000000, description: 壁纸币价格最小单位，100单位=1币 }
        originalFile: { type: string, format: binary, description: 原文件最大10GiB；修改时省略则保留 }
        coverFile: { type: string, format: binary, description: 封面最大4MiB；修改时省略则保留 }
        creator: { type: string, maxLength: 120 }
    AdminProduct:
      type: object
      required: [id, title, description, categoryId, categoryName, type, priceCents, currency, coverUrl, width, height, fps, sha256, sizeBytes, creator, publicationStatus, originalFilename, coverFilename]
      properties:
        id: { type: string, pattern: '^[A-Za-z0-9._-]+$', example: '1' }
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 4000 }
        categoryId: { type: string }
        categoryName: { type: string }
        type: { type: string, enum: [IMAGE, GIF, VIDEO] }
        priceCents: { type: integer, minimum: 0, maximum: 100000000, description: 壁纸币价格最小单位，100单位=1币 }
        currency: { type: string, enum: [ZLC] }
        coverUrl: { type: string, description: 当前后端管理员封面URL，须带Bearer；无封面草稿为空字符串 }
        width: { type: integer, minimum: 1, nullable: true }
        height: { type: integer, minimum: 1, nullable: true }
        fps: { type: number, minimum: 0, nullable: true }
        sha256: { type: string, nullable: true, pattern: '^[a-f0-9]{64}$', description: 当前原文件校验值，用于下载校验及本地文件识别 }
        sizeBytes: { type: string, nullable: true, pattern: '^[1-9][0-9]*$', example: '18422301' }
        creator: { type: string }
        publicationStatus: { type: string, enum: [DRAFT, PUBLISHED, WITHDRAWN] }
        originalFilename: { type: string, description: 当前原文件显示名；无文件为空 }
        coverFilename: { type: string, description: 当前封面显示名；无文件为空 }
