spring:
  application:
    name: zlowallpaper-server
  profiles:
    default: local
  jackson:
    time-zone: UTC
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 10GB
      max-request-size: 11GB

server:
  port: ${SERVER_PORT:8080}
  address: 127.0.0.1
  servlet:
    context-path: /api/v1
  error:
    include-message: never
    include-stacktrace: never

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

wallpaper:
  cors:
    allowed-origins: "${WALLPAPER_CORS_ALLOWED_ORIGINS:http://127.0.0.1:4173,http://localhost:4173}"
  test-payment:
    enabled: false
